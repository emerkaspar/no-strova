<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Planejamento e análise de treino para quem pedala e corre." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FF5200" />
    <meta property="og:title" content="NÃO STROVA" />
    <meta property="og:description" content="Quem gosta de curtida é ovo." />
    <meta property="og:image" content="%URL_BASE_SITE%/og/og-image-1200x630.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>NÃO STROVA</title>
    <script>
      // Escuro é o padrão. Se o usuário escolheu o claro, aplica antes da primeira pintura, para não piscar.
      try {
        var t = localStorage.getItem('no-strova:tema');
        if (t === 'claro') {
          document.documentElement.dataset.tema = 'claro';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f6f4');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>O NÃO STROVA precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

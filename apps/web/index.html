<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Planejamento e análise de treino para quem pedala e corre." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>No Strova</title>
    <script>
      // Escuro é o padrão. Se o usuário escolheu o claro, aplica antes da primeira pintura, para não piscar.
      try {
        var t = localStorage.getItem('no-strova:tema');
        if (t === 'claro') {
          document.documentElement.dataset.tema = 'claro';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f6f4');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>O No Strova precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
